name: framemind

x-backend-env: &backend-env
  ConnectionStrings__Postgres: Host=postgres;Database=framemind;Username=framemind;Password=${POSTGRES_PASSWORD:-framemind}
  ConnectionStrings__Redis: redis:6379
  ConnectionStrings__RabbitMq: amqp://framemind:${RABBITMQ_PASSWORD:-framemind}@rabbitmq:5672
  Llm__Provider: ${LLM_PROVIDER:-Ollama}
  Llm__Ollama__BaseUrl: http://ollama:11434
  Llm__Ollama__Model: ${OLLAMA_MODEL:-gemma3:4b}
  Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
  Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
  Firebase__PushEnabled: ${FIREBASE_PUSH_ENABLED:-false}
  Firebase__CredentialsPath: ${FIREBASE_CREDENTIALS_PATH:-}
  Storage__ServiceUrl: http://storage:8333
  Storage__PublicServiceUrl: ${STORAGE_PUBLIC_URL:-http://localhost:8333}
  Storage__AccessKey: ${S3_ACCESS_KEY:-framemind}
  Storage__SecretKey: ${S3_SECRET_KEY:-framemind-secret}
  Storage__ForcePathStyle: "true"
  Storage__CreateBucketIfMissing: "true"
  VideoGeneration__Provider: ${VIDEO_PROVIDER:-Storyboard}
  VideoGeneration__Veo__ApiKey: ${GOOGLE_API_KEY:-}
  Voice__Provider: ${VOICE_PROVIDER:-EdgeTts}
  Voice__ElevenLabs__ApiKey: ${ELEVENLABS_API_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: framemind
      POSTGRES_USER: framemind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-framemind}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framemind"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: framemind
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-framemind}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # Free S3-compatible object storage (MinIO no longer publishes free images).
  # Credentials come from .env and are written into SeaweedFS's S3 identity config.
  storage:
    image: chrislusf/seaweedfs:latest
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-framemind}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-framemind-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"framemind","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports: ["8333:8333"]
    volumes: [storagedata:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      retries: 30
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollamadata:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-gemma3:4b}"]
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ./backend, target: api }
    restart: unless-stopped
    environment:
      <<: *backend-env
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Database__MigrateOnStartup: "true"
    ports: ["8080:8080"]
    volumes: ["${FIREBASE_CREDENTIALS_DIR:-./secrets}:/secrets:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started }
      storage: { condition: service_healthy }
      ollama: { condition: service_healthy }

  worker:
    build: { context: ./backend, target: worker }
    restart: unless-stopped
    environment:
      <<: *backend-env
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    volumes: ["${FIREBASE_CREDENTIALS_DIR:-./secrets}:/secrets:ro"]
    depends_on:
      api: { condition: service_started }
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

volumes:
  pgdata:
  storagedata:
  ollamadata:
